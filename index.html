<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>피란의 기억을 잇다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@400;600;700&display=swap">
<style>
  :root {
    --page: #d8d2c3;
    --cream: #f1e7cc;
    --ink: #2a2218;
    --paper: #eadfc0;
    --paper-2: #d6c294;
    --brass: #b8924a;
    --brass-hi: #f0cf7a;
    --line: #231b13;
    --serif: "Noto Serif KR", "Gowun Batang", "Nanum Myeongjo", "Batang", "Apple SD Gothic Neo", serif;
    --book: "Gowun Batang", "Noto Serif KR", "Nanum Myeongjo", "Batang", "Apple SD Gothic Neo", serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page: #0b0f15; }
  }
  :root[data-theme="dark"] { --page: #0b0f15; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--page);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--book);
    -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; }
  body { touch-action: manipulation; }

  #stage { position: relative; width: 1280px; height: 720px; flex: none; overflow: hidden; background: #000; transform-origin: center center; }
  .screen { position: absolute; inset: 0; visibility: hidden; opacity: 0; }
  .screen.active { visibility: visible; opacity: 1; }
  #fader { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .32s ease; z-index: 50; }
  #fader.on { opacity: 1; pointer-events: auto; }
  .bg, .bg svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ── 버튼: 대화창 액자 느낌의 양피지 판 ── */
  .plate {
    --cut: 16px;
    position: relative; border: 0; padding: 0; cursor: pointer; background: var(--line);
    clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut));
    transition: transform .15s ease;
  }
  .plate::before, .plate::after { content: ""; position: absolute; }
  .plate::before {
    inset: 3px; background: var(--brass);
    clip-path: polygon(13px 0, calc(100% - 13px) 0, 100% 13px, 100% calc(100% - 13px), calc(100% - 13px) 100%, 13px 100%, 0 calc(100% - 13px), 0 13px);
  }
  .plate::after {
    inset: 6px; background: linear-gradient(#f0e5c6, var(--paper-2));
    clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
  }
  .plate > * { position: relative; z-index: 1; }
  .plate:hover:not(:disabled), .plate:focus-visible { transform: translateY(-3px); }
  .plate:hover:not(:disabled)::before, .plate:focus-visible::before { background: var(--brass-hi); }
  .plate:focus-visible { outline: none; }
  .plate:disabled { cursor: not-allowed; filter: grayscale(.85) brightness(.66); }

  /* ── 타이틀: 일러스트 위에 버튼 강조 효과만 얹음 ── */
  .title-art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .title-art.blur { filter: blur(8px) brightness(.55); transform: scale(1.8); transform-origin: 10% 100%; }
  .tb { position: absolute; padding: 0; border: 0; background: none; cursor: pointer; filter: drop-shadow(0 0 0 rgba(255,205,110,0)); transition: filter .22s ease, transform .18s ease; }
  .school-logo { position: absolute; height: auto; pointer-events: none; filter: drop-shadow(0 2px 5px rgba(0,0,0,.45)); }
  .tb .fill, .tb .sheen { position: absolute; inset: 0; pointer-events: none; clip-path: polygon(3.8% 0, 96.2% 0, 100% 17.5%, 100% 82.5%, 96.2% 100%, 3.8% 100%, 0 82.5%, 0 17.5%); }
  .tb .fill { background: radial-gradient(ellipse at 50% 50%, rgba(255,228,165,.15), rgba(255,206,120,.05) 72%); opacity: 0; transition: opacity .2s ease; }
  .tb .sheen::before { content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 34%; background: linear-gradient(100deg, transparent, rgba(255,242,205,.6), transparent); transform: skewX(-18deg); opacity: 0; }
  .tb .ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; opacity: 0; transition: opacity .2s ease; }
  .tb .ring polygon { fill: none; stroke: #ffe3a3; stroke-width: 2.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .tb:hover, .tb:focus-visible { filter: drop-shadow(0 0 3px rgba(255,225,150,.95)) drop-shadow(0 0 14px rgba(255,190,90,.75)); transform: scale(1.02); outline: none; }
  .tb:hover .fill, .tb:focus-visible .fill, .tb:hover .ring, .tb:focus-visible .ring { opacity: 1; }
  .tb:hover .sheen::before, .tb:focus-visible .sheen::before { animation: sheen .8s ease-out 1 forwards; }
  .tb:active { transform: scale(.99); }
  @keyframes sheen { 0% { left: -40%; opacity: 1; } 100% { left: 110%; opacity: 1; } }
  .tb.sm .fill, .tb.sm .sheen { clip-path: polygon(5.2% 0, 94.8% 0, 100% 17.4%, 100% 82.6%, 94.8% 100%, 5.2% 100%, 0 82.6%, 0 17.4%); }
  #stage.on-credits .mute { top: 52px; }   /* 제작자 그림 오른쪽 위 글씨를 가리지 않게 */
  .toast { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); padding: 12px 28px; background: rgba(20,16,12,.9); color: var(--cream); border: 1px solid var(--brass); border-radius: 4px; font: 400 22px var(--book); letter-spacing: .06em; opacity: 0; transition: opacity .25s ease; pointer-events: none; z-index: 40; }
  .toast.show { opacity: 1; }

  /* ── 챕터 선택 ── */
  .shade-all { position: absolute; inset: 0; background: rgba(6,9,14,.5); }
  .ch-head { position: absolute; left: 0; right: 0; top: 92px; text-align: center; }
  .ch-head h2 { margin: 0; font: 700 50px/1.2 var(--serif); letter-spacing: .16em; color: var(--cream); }
  .ch-head i { display: block; width: 96px; height: 3px; background: var(--brass); margin: 22px auto 0; }
  .ch-grid { position: absolute; left: 50%; top: 250px; transform: translateX(-50%); display: grid; grid-template-columns: repeat(3, 320px); gap: 30px 32px; }
  .card { height: 152px; color: var(--ink); text-align: center; }
  .card .in { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; height: 100%; }
  .card b { font: 700 40px/1 var(--serif); letter-spacing: .08em; }
  .card small { display: inline-flex; align-items: center; gap: 6px; font: 400 19px/1 var(--book); letter-spacing: .08em; color: #5b4a30; }
  .card small svg { width: 15px; height: 15px; }
  .back { position: absolute; left: 60px; bottom: 48px; background: none; border: 0; cursor: pointer; font: 400 24px var(--book); letter-spacing: .1em; color: var(--cream); padding: 10px 14px; border-radius: 4px; }
  .back:hover, .back:focus-visible { color: var(--brass-hi); outline: none; text-decoration: underline; text-underline-offset: 8px; }

  /* ── 대화 씬 ── */
  #vn { background: #000; cursor: default; }
  .scene { position: absolute; inset: 0; opacity: 0; transition: opacity .38s ease; }
  #vn[data-view="room"] .scene { opacity: 1; }
    .scene .vig { position: absolute; inset: 0; z-index: 1; background: linear-gradient(rgba(0,0,0,.26), rgba(0,0,0,.26)), radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 40%, rgba(0,0,0,.5) 100%); }
  .frozen { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .38s ease; display: block; }
  .frozen.now { transition: none; }
  #vn[data-view="room"] .frozen, #vn[data-view="still"] .frozen { opacity: 1; }
  .portrait { position: absolute; z-index: 2; bottom: 215px; height: 470px; transition: filter .28s ease, transform .28s ease; pointer-events: none; }
  .portrait img { height: 100%; display: block; }
  #pBoy { left: 120px; }
  #pGrand { right: 120px; }
  .portrait.dim { filter: brightness(.5) saturate(.72); transform: translateY(12px); }
  .portrait.on { z-index: 3; }

  .dialog { position: absolute; left: 50%; bottom: 18px; width: 1040px; transform: translateX(-50%); opacity: 0; transition: opacity .3s ease; z-index: 5; }
  #vn[data-view="room"] .dialog, #vn[data-view="dark"] .dialog { opacity: 1; }
  .dialog > img { width: 100%; display: block; }
  .dialog .name { position: absolute; left: 9.1%; top: 15%; width: 21%; height: 14.4%; display: flex; align-items: center; justify-content: center; font: 700 26px var(--serif); letter-spacing: .16em; color: #f2e6c8; text-shadow: 0 1px 3px rgba(0,0,0,.7); white-space: nowrap; }
  .dialog .body { position: absolute; left: 8.1%; top: 35.9%; width: 82.8%; height: 56.8%; font: 400 31px/1.56 var(--book); color: #33281c; white-space: pre-wrap; word-break: keep-all; overflow-wrap: break-word; }
  .dialog .next { position: absolute; left: 93.3%; top: 80.1%; width: 3.65%; opacity: 0; }
  .dialog .next img { width: 100%; display: block; }
  .dialog .next.on { opacity: 1; animation: bob 1.1s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

  .ch { opacity: 0; }
  .ch.on { opacity: 1; }

  .narr { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .38s ease; z-index: 8; pointer-events: none; }
  #vn[data-view="black"] .narr { opacity: 1; }
  .narr [data-k] { display: none; }
  .narr[data-kind="text"] [data-k="text"], .narr[data-kind="kw"] [data-k="kw"], .narr[data-kind="search"] [data-k="search"] { display: block; }
  .narr-text { max-width: 920px; text-align: center; font: 400 38px/1.75 var(--serif); color: #e8dec6; white-space: pre-wrap; word-break: keep-all; overflow-wrap: break-word; }
  .narr-next { position: absolute; left: 50%; bottom: 66px; width: 0; height: 0; margin-left: -11px; border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 15px solid #c9bb95; opacity: 0; }
  .narr-next.on { opacity: .85; animation: bob 1.1s ease-in-out infinite; }

  .kw { text-align: center; }
  .kw-title { display: flex; align-items: center; justify-content: center; gap: 22px; font: 600 28px/1 var(--serif); letter-spacing: .5em; color: var(--brass-hi); margin-bottom: 54px; min-height: 28px; padding-left: .5em; }
  .kw-title::before, .kw-title::after { content: ""; width: 84px; height: 2px; background: var(--brass); opacity: .8; }
  .kw-list { display: flex; gap: 34px; justify-content: center; }
  .kw-chip { --cut: 12px; position: relative; min-width: 210px; padding: 26px 40px; background: var(--line); opacity: 0; transition: opacity .4s ease; font: 700 44px/1 var(--serif); letter-spacing: .1em; color: var(--ink);
    clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut)); }
  .kw-chip::before { content: ""; position: absolute; inset: 3px; background: linear-gradient(#f0e5c6, var(--paper-2)); border: 2px solid var(--brass);
    clip-path: polygon(9px 0, calc(100% - 9px) 0, 100% 9px, 100% calc(100% - 9px), calc(100% - 9px) 100%, 9px 100%, 0 calc(100% - 9px), 0 9px); box-sizing: border-box; }
  .kw-chip span { position: relative; }
  .kw-chip.on { opacity: 1; }

  .search-bar { display: flex; align-items: center; gap: 22px; width: 760px; height: 88px; padding: 0 36px; border-radius: 44px; background: #f2ecdd; box-shadow: 0 0 0 3px rgba(184,146,74,.55); }
  .search-bar svg { width: 34px; height: 34px; flex: none; }
  .search-text { font: 400 36px/1 "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; color: #26221c; white-space: pre; }
  .caret { width: 2px; height: 40px; background: #26221c; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── 필드 ── */
  .mission { --c: 12px; position: absolute; left: 28px; top: 22px; width: 380px; background: var(--brass); opacity: 0; transition: opacity .3s ease; pointer-events: none; z-index: 5;
    clip-path: polygon(var(--c) 0, calc(100% - var(--c)) 0, 100% var(--c), 100% calc(100% - var(--c)), calc(100% - var(--c)) 100%, var(--c) 100%, 0 calc(100% - var(--c)), 0 var(--c)); }
  .mission.on { opacity: 1; }
  .mission .in { margin: 2px; padding: 13px 20px 17px; background: linear-gradient(#231d15, #17130f);
    clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px); }
  .mission .tag { font: 700 15px/1 var(--serif); letter-spacing: .36em; color: var(--brass-hi); margin-bottom: 10px; }
  .mission .txt { display: flex; gap: 11px; font: 400 20px/1.5 var(--book); color: var(--cream); word-break: keep-all; }
  .mission .txt::before { content: ""; flex: none; width: 12px; height: 12px; margin-top: 8px; border: 2px solid var(--brass-hi); }
  #field canvas { display: block; width: 1280px; height: 720px; }
  #field canvas:focus { outline: none; }


  /* ── 모바일 터치 버튼: 화면(무대) 바깥 기준으로 고정, 캐릭터가 서는 바닥선 아래에만 놓음 ── */
  #touch { --sz: 72px; position: fixed; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between; align-items: flex-end;
    padding: 0 max(14px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom, 0px) + 10px) max(14px, env(safe-area-inset-left)); pointer-events: none; z-index: 60; }
  #touch.on { display: flex; }
  .tc { display: flex; gap: calc(var(--sz) * .18); }
  .tbn { pointer-events: auto; position: relative; width: var(--sz); height: var(--sz); border: 0; padding: 0; border-radius: 50%;
    background: rgba(28,23,17,.74); color: var(--cream); font: 700 calc(var(--sz) * .27)/1 var(--serif); letter-spacing: .04em;
    box-shadow: inset 0 0 0 2px var(--brass), 0 2px 10px rgba(0,0,0,.4); touch-action: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; }
  .tbn.down { background: var(--brass); color: var(--ink); box-shadow: inset 0 0 0 2px var(--brass-hi), 0 0 14px rgba(240,207,122,.65); }
  .arr { position: absolute; left: 50%; top: 50%; width: 0; height: 0; border-top: calc(var(--sz) * .2) solid transparent; border-bottom: calc(var(--sz) * .2) solid transparent; }
  .arr.l { border-right: calc(var(--sz) * .28) solid currentColor; transform: translate(-62%, -50%); }
  .arr.r { border-left: calc(var(--sz) * .28) solid currentColor; transform: translate(-38%, -50%); }


  /* 굵은 글씨 / 강조 */
  .dialog .body .b { font-weight: 700; }
  .dialog .body .em { font-weight: 700; color: #8f2f1d; }
  .narr-text .b { font-weight: 700; }
  .narr-text .em { font-weight: 700; color: var(--brass-hi); }

  /* 사진 장면 (손수건·피란·기억): 대화창에 가리지 않도록 위쪽 빈 공간에 액자로 보여줌 */
  .photo-wrap { position: absolute; inset: 0; opacity: 0; transition: opacity .45s ease; pointer-events: none; z-index: 3; background: #0b0d10; }
  #vn[data-view="photo"] .photo-wrap { opacity: 1; }
  .photo-bg { position: absolute; left: -40px; top: -40px; width: calc(100% + 80px); height: calc(100% + 80px); object-fit: cover; filter: blur(24px) brightness(.42) saturate(.9); }
  .photo-frame { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); padding: 8px; background: #efe6cf; box-shadow: 0 12px 44px rgba(0,0,0,.65); }
  .photo-frame img { display: block; height: 384px; width: auto; }
  #vn[data-view="photo"] .dialog { opacity: 1; }

  /* 퀴즈 */
  #vn[data-view="quiz"] .frozen { opacity: 1; }
  .quiz { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 9; background: rgba(6,9,14,.68); }
  #vn[data-view="quiz"] .quiz.on { display: flex; }
  .q-panel { --c: 16px; width: 920px; background: var(--brass); padding: 3px;
    clip-path: polygon(var(--c) 0, calc(100% - var(--c)) 0, 100% var(--c), 100% calc(100% - var(--c)), calc(100% - var(--c)) 100%, var(--c) 100%, 0 calc(100% - var(--c)), 0 var(--c)); }
  .q-in { padding: 30px 46px 30px; background: linear-gradient(#f2e8c9, var(--paper-2));
    clip-path: polygon(13px 0, calc(100% - 13px) 0, 100% 13px, 100% calc(100% - 13px), calc(100% - 13px) 100%, 13px 100%, 0 calc(100% - 13px), 0 13px); }
  .q-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .q-head #qNum { font: 700 44px/1 var(--serif); color: #7a5a25; letter-spacing: .06em; }
  .q-head #qCount { font: 400 20px/1 var(--book); color: #6b5a3c; letter-spacing: .1em; }
  .q-text { font: 700 34px/1.45 var(--serif); color: var(--ink); margin-bottom: 20px; word-break: keep-all; }
  .q-opts { display: flex; flex-direction: column; gap: 11px; }
  .q-opt { display: flex; gap: 16px; align-items: center; text-align: left; width: 100%; padding: 14px 22px; border: 2px solid rgba(122,90,37,.55); border-radius: 6px; background: rgba(255,255,255,.34); cursor: pointer;
    font: 400 28px/1.35 var(--book); color: var(--ink); word-break: keep-all; transition: background .15s ease, border-color .15s ease, transform .12s ease; }
  .q-opt .n { flex: none; font-weight: 700; color: #7a5a25; }
  .q-opt:hover, .q-opt:focus-visible { background: #f8ecc4; border-color: var(--brass); transform: translateX(4px); outline: none; }
  .q-opt.ok { background: #d4e4b8; border-color: #6e8f4a; }
  .q-opt.bad { background: #ecc6b8; border-color: #a5482e; animation: shake .4s ease; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .q-msg { min-height: 44px; margin-top: 14px; text-align: center; font: 700 30px/1.4 var(--serif); }
  .q-msg.ok { color: #4d6b2c; }
  .q-msg.bad { color: #8f2f1d; }
  .mission.flash .in { animation: mflash .9s ease; }
  @keyframes mflash { 0% { filter: brightness(2.2); } 100% { filter: none; } }


  .mission.mission-tr { left: auto; right: 28px; }
  .home-btn { position: absolute; top: 14px; right: 68px; height: 40px; padding: 0 20px; border: 0; border-radius: 20px; z-index: 6; cursor: pointer; display: none; align-items: center;
    background: rgba(28,23,17,.72); color: var(--cream); box-shadow: inset 0 0 0 2px var(--brass); font: 600 18px/1 var(--serif); letter-spacing: .08em; -webkit-tap-highlight-color: transparent; }
  .home-btn.on { display: flex; }
  .home-btn:hover, .home-btn:focus-visible { background: rgba(60,48,30,.9); box-shadow: inset 0 0 0 2px var(--brass-hi); outline: none; }
  .mute { position: absolute; top: 14px; right: 16px; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; z-index: 45; cursor: pointer;
    background: rgba(28,23,17,.72); color: var(--cream); box-shadow: inset 0 0 0 2px var(--brass); display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
  .mute svg { width: 24px; height: 24px; }
  .mute .x { display: none; }
  .mute.off .w { display: none; } .mute.off .x { display: block; } .mute.off { color: #b9ad90; }
  .mute:hover, .mute:focus-visible { background: rgba(60,48,30,.9); box-shadow: inset 0 0 0 2px var(--brass-hi); outline: none; }


  /* 제작자: 사진(또는 선생님 카드) 위에 마우스를 올리면 그 자리에 바로 어두운 안내가 뜸 — 절대 사진 경계를 넘지 않음 */
  .cred-pins { position: absolute; inset: 0; z-index: 4; pointer-events: none; }   /* 뒤로가기 버튼 등 다른 요소를 가리지 않도록 */
  .cred-pin { pointer-events: auto; }
  .cred-pin { position: absolute; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 9px; overflow: hidden; -webkit-tap-highlight-color: transparent; transition: box-shadow .18s ease; }
  .cred-pin:hover, .cred-pin:focus-visible, .cred-pin.show { outline: none; box-shadow: inset 0 0 0 2px rgba(240,207,122,.92), 0 0 12px 1px rgba(240,207,122,.4); }
  .cred-pin .ov { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; text-align: center;
    padding: 6%; background: rgba(10,8,6,0); opacity: 0; transition: opacity .18s ease, background .18s ease; }

    mission() { [660, 880, 1100].forEach((f, i) => tone(f, 0.32, 0.09, { delay: i * 0.09 })); },
    tvOn() { noise(0.26, 0.09, { type: 'highpass', f: 2500, q: 0.6 }); tone(1000, 0.05, 0.05, { type: 'square', delay: 0.26 }); },
    correct() { [523, 659, 784].forEach((f, i) => tone(f, 0.26, 0.09, { delay: i * 0.08 })); },
    wrong() { tone(210, 0.2, 0.11, { type: 'triangle', f1: 160 }); tone(150, 0.3, 0.11, { type: 'triangle', delay: 0.16, f1: 110 }); },
  };

// segs: [{s:'글자', b:1, em:1}, {p:멈춤ms}]  — 굵은 글씨/강조/잠시 멈춤을 지원
function typeInto(el, segs, tk, ms) {
  return new Promise(resolve => {
    el.textContent = '';
    const units = [], spans = [];
    for (const sg of segs) {
      if (sg.p) { units.push({ p: sg.p }); continue; }
      for (const ch of sg.s) {
        const s = document.createElement('span');
        s.className = 'ch' + (sg.b ? ' b' : '') + (sg.em ? ' em' : '');
        s.textContent = ch; el.appendChild(s); spans.push(s);
        units.push({ ch, s });
      }
    }
    let i = 0, done = false;
    const finish = () => { if (done) return; done = true; spans.forEach(s => s.classList.add('on')); vn.finish = null; resolve(true); };
    vn.finish = finish;
    if (vn.fast) return finish();
    const tick = () => {
      if (done) return;
      if (tk !== vn.token) { done = true; return resolve(false); }
      if (i >= units.length) return finish();
      const u = units[i++];
      if (u.p) { setTimeout(tick, vn.fast ? 0 : u.p); return; }
      u.s.classList.add('on');
      SFX.blip(vn.voice, u.ch);
      let d = ms;
      if (u.ch === ' ' || u.ch === '\n') d = 0;
      else if (u.ch === ',') d += 70;
      else if ('.…?!'.includes(u.ch)) d += 130;
      setTimeout(tick, d);
    };
    tick();
  });
}

function runQuiz(st) {
  return new Promise(resolve => {
    const qs = st.questions;
    let qi = 0, locked = false;
    const NUM = '①②③④';
    const render = () => {
      const q = qs[qi];
      qNum.textContent = 'Q' + (qi + 1); qCount.textContent = `${qi + 1} / ${qs.length}`;
      qText.textContent = q.q; qMsg.textContent = ''; qMsg.className = 'q-msg';
      qOpts.innerHTML = '';
      q.opts.forEach((o, k) => {
        const b = document.createElement('button'); b.className = 'q-opt';
        b.innerHTML = '<span class="n"></span><span class="t"></span>';
        b.firstChild.textContent = NUM[k]; b.lastChild.textContent = o;
        b.addEventListener('click', e => { e.stopPropagation(); pick(k); });
        qOpts.appendChild(b);
      });
    };
    const pick = k => {
      if (locked || k < 0 || k >= qs[qi].opts.length) return;
      locked = true;
      const btn = qOpts.children[k];
      if (k === qs[qi].ans) {
        btn.classList.add('ok'); SFX.correct(); qMsg.textContent = '정답이에요!'; qMsg.className = 'q-msg ok';
        setTimeout(() => { qi++; locked = false; if (qi >= qs.length) { vn.quizPick = null; quizEl.classList.remove('on'); resolve(); } else render(); }, 950);
      } else {
        btn.classList.add('bad'); SFX.wrong(); qMsg.textContent = st.retry; qMsg.className = 'q-msg bad';
        setTimeout(() => { qi = 0; locked = false; render(); }, 1600);   // 틀리면 Q1로 돌아감
      }
    };
    vn.quizPick = pick;
    quizEl.classList.add('on'); render();
  });
}

async function runStep() {
  const tk = ++vn.token;
  const st = vn.steps[vn.i];
  vn.ready = false; vn.fast = false; vn.finish = null; vn.t0 = performance.now(); vn.voice = 'narr';
  nextDlg.classList.remove('on'); narrNext.classList.remove('on');

  if (st.type === 'villagerDone') { st.resolve(); return; }   // 주민 대화가 끝나면 제자리로 돌아가기 위한 표시
  if (st.type === 'field') {                 // 병실: 손주 조작 구간 (목표를 마치면 대화가 이어짐)
    pendingField = { map: st.map || 'hospital', objectives: st.objectives, resume: !!hospState };
    await go('field');
    return;
  }
  if (st.type === 'wait') {                  // "(잠시 기다렸다가)"
    bodyEl.textContent = ''; narrText.textContent = '';
    await sleep(st.ms);
    if (tk !== vn.token) return;
    vn.i++; if (vn.i < vn.steps.length) runStep();
    return;
  }
  if (st.type === 'quiz') {
    if (vn.view !== 'quiz') { setView('quiz'); await sleep(420); }
    if (tk !== vn.token) return;
    await runQuiz(st);
    if (tk !== vn.token) return;
    vn.i++; if (vn.i < vn.steps.length) runStep();
    return;
  }

  if (st.type === 'say') {
    const want = st.photo ? 'photo' : (st.who === '??' ? 'dark' : 'room');
    vn.voice = st.who;
    if (want === 'photo') { photoEl.src = A.photos[st.photo]; photoBgEl.src = A.photos[st.photo]; if (vn.view !== 'photo') SFX.photo(); }
    if (want === 'room') {
      const isLeft = st.side ? st.side === 'left' : st.who === '손자';
      pBoy.classList.toggle('dim', !isLeft); pBoy.classList.toggle('on', isLeft);
      pGrand.classList.toggle('dim', isLeft); pGrand.classList.toggle('on', !isLeft);
      if (isLeft && LEFT_BUST[st.who]) imgBoy.src = LEFT_BUST[st.who];
      if (!isLeft && RIGHT_BUST[st.who]) imgGrand.src = RIGHT_BUST[st.who];
    }
    setName(st.who);
    bodyEl.textContent = '';
    if (want !== vn.view) { setView(want); await sleep(want === 'photo' ? 520 : 420); } else await sleep(120);
    if (tk !== vn.token) return;
    await typeInto(bodyEl, st.segs, tk, SAY_MS);
    if (tk !== vn.token) return;
    nextDlg.classList.add('on');
    vn.ready = true;
    return;
  }

  // 화자가 없는 문장: 검은 화면
  const changed = vn.view !== 'black';
  if (changed) { narr.dataset.kind = 'none'; setView('black'); await sleep(460); }
  else await sleep(200);
  if (tk !== vn.token) return;

  if (st.type === 'narr') {
    narr.dataset.kind = 'text';
    await typeInto(narrText, st.segs, tk, NARR_MS);
  } else if (st.type === 'search') {
    narr.dataset.kind = 'search';
    await typeInto(searchText, plain(st.text), tk, 55);
  } else if (st.type === 'keywords') {
    narr.dataset.kind = 'kw';
    kwTitle.textContent = ''; chips.forEach(c => { c.classList.remove('on'); c.firstChild.textContent = ''; });
    if (!await typeInto(kwTitle, plain(st.title), tk, 70)) return;
    await wait(260);
    for (let k = 0; k < st.items.length && k < chips.length; k++) {
      if (tk !== vn.token) return;
      chips[k].classList.add('on'); SFX.chip();
      await wait(220);
      if (!await typeInto(chips[k].firstChild, plain(st.items[k]), tk, 85)) return;
      if (!game.fragments.includes(st.items[k])) game.fragments.push(st.items[k]);
      await wait(220);
    }
  } else if (st.type === 'blackout') {
    narr.dataset.kind = 'none';
    await sleep(1500);
    if (tk !== vn.token) return;
    pendingField = { map: 'outdoor', objectives: [], resume: false };
    await go('field');
    return;
  }
  if (tk !== vn.token) return;
  narrNext.classList.add('on');
  vn.ready = true;
}

        <input id="spellInput" type="text" style="width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:2px solid #8a7550;background:#fbf3df;color:#231a10;font:500 15px 'Noto Sans KR',sans-serif;outline:none;" placeholder="여기에 입력하세요" />
        <div id="spellMsg" style="min-height:22px;color:#e08a6a;font:700 14px 'Noto Sans KR',sans-serif;text-align:center;margin-top:10px;"></div>
        <div style="text-align:center;margin-top:12px;">
          <button id="spellBtn" style="background:#f0cf7a;color:#241b10;border:none;border-radius:10px;padding:10px 26px;font:700 15px 'Noto Sans KR',sans-serif;cursor:pointer;">성불시키기</button>
        </div>
      </div>`;
    (document.getElementById('stage') || document.body).appendChild(wrap);
    const input = wrap.querySelector('#spellInput'), msg = wrap.querySelector('#spellMsg'), btn = wrap.querySelector('#spellBtn');
    input.focus();
    const submit = () => {
      if (input.value.trim() === SPELL_TEXT) {
        SFX.mission();
        msg.style.color = '#9fe39f'; msg.textContent = '성불하였습니다…';
        wrap.style.transition = 'opacity .5s ease'; wrap.style.opacity = '0';
        setTimeout(() => { wrap.remove(); resolve(); }, 550);
      } else {
        SFX.blocked();
        msg.textContent = '다시 성불 주문을 입력하세요';
        input.style.borderColor = '#e08a6a';
        wrap.style.transition = 'transform .07s'; wrap.style.transform = 'translateX(-8px)';
        setTimeout(() => { wrap.style.transform = 'translateX(8px)'; }, 70);
        setTimeout(() => { wrap.style.transform = 'translateX(0)'; input.style.borderColor = '#8a7550'; }, 140);
      }
    };
    btn.addEventListener('click', submit);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); e.stopPropagation(); });
  });
}
function runPuzzleGame() {
  return new Promise(resolve => {
    held.length = 0;
    draw(true); fctx.drawImage(canvas, 0, 0);
    missionEl.classList.remove('on');
    frozen.classList.add('now');
    setView('still');
    screens.forEach(s => s.classList.toggle('active', s.id === 'vn'));
    mode = 'vn'; updateTouch();
    requestAnimationFrame(() => requestAnimationFrame(() => frozen.classList.remove('now')));

    const W = 320, H = Math.round(W * 698 / 523), scale = W / 523;
    const slots = [
      { id: 1, x: 95, y: 55, w: 130, h: 110 },
      { id: 2, x: 275, y: 55, w: 130, h: 110 },
      { id: 3, x: 150, y: 185, w: 190, h: 155 },
      { id: 4, x: 95, y: 355, w: 130, h: 110 },
      { id: 5, x: 275, y: 355, w: 130, h: 110 },
    ];
    const wrap = document.createElement('div');
    wrap.id = 'puzzleWrap';
    wrap.style.cssText = 'position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,8,6,.55);gap:18px;';
    const title = document.createElement('div');
    title.id = 'puzzleTitle';
    title.style.cssText = 'color:#f7ecc9;font:700 18px "Noto Sans KR",sans-serif;text-shadow:0 1px 3px #000;';
    title.textContent = '조각을 드래그해서 알맞은 자리에 맞춰보자';
    wrap.appendChild(title);
    const boardBox = document.createElement('div');
    boardBox.id = 'puzzleBoard';
    boardBox.style.cssText = `position:relative;width:${W}px;height:${H}px;`;
    const boardImg = document.createElement('img');
    boardImg.src = A.puzzle.board;
    boardImg.style.cssText = `position:absolute;left:0;top:0;width:${W}px;height:${H}px;pointer-events:none;`;
    boardBox.appendChild(boardImg);
    wrap.appendChild(boardBox);
    const tray = document.createElement('div');
    tray.style.cssText = 'display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:90%;';
    wrap.appendChild(tray);
    document.getElementById('vn').appendChild(wrap);

    let placed = 0;
    const shuffled = [...slots].sort(() => Math.random() - 0.5);
    shuffled.forEach(slot => {
      const pImg = document.createElement('img');
      pImg.src = A.puzzle.pieces[slot.id - 1];
      pImg.dataset.id = slot.id;
      pImg.style.cssText = 'width:58px;height:auto;cursor:grab;touch-action:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.55));user-select:none;';
      tray.appendChild(pImg);
      let dragging = false, offX = 0, offY = 0;
      const onDown = e => {
        dragging = true;
        const r = pImg.getBoundingClientRect();
        offX = e.clientX - r.left; offY = e.clientY - r.top;
        document.body.appendChild(pImg);
        pImg.style.position = 'fixed'; pImg.style.left = r.left + 'px'; pImg.style.top = r.top + 'px'; pImg.style.width = r.width + 'px'; pImg.style.zIndex = 999;
        e.preventDefault();
      };
      const onMove = e => {
        if (!dragging) return;
        const pt = e.touches ? e.touches[0] : e;
        pImg.style.left = (pt.clientX - offX) + 'px'; pImg.style.top = (pt.clientY - offY) + 'px';
      };
      const onUp = e => {
        if (!dragging) return; dragging = false;
        const pt = e.changedTouches ? e.changedTouches[0] : e;
        const br = boardBox.getBoundingClientRect();
        const cx = pt.clientX - br.left, cy = pt.clientY - br.top;
        const tx = slot.x * scale, ty = slot.y * scale, tw = slot.w * scale, th = slot.h * scale;
        const within = cx >= tx - 24 && cx <= tx + tw + 24 && cy >= ty - 24 && cy <= ty + th + 24;
        if (within) {
          boardBox.appendChild(pImg);
          pImg.style.position = 'absolute'; pImg.style.left = tx + 'px'; pImg.style.top = ty + 'px'; pImg.style.width = tw + 'px'; pImg.style.height = th + 'px';
          pImg.style.cursor = 'default'; pImg.style.filter = 'none'; pImg.style.transition = 'transform .18s ease';
          pImg.style.transform = 'scale(1.12)'; setTimeout(() => { pImg.style.transform = 'scale(1)'; }, 180);
          SFX.get('stone'); placed++;
          if (placed >= 5) {
            title.textContent = '복원이 완료되었습니다!';
            setTimeout(() => { boardImg.src = A.puzzle.done; }, 250);
            setTimeout(() => { wrap.style.transition = 'opacity .5s'; wrap.style.opacity = '0'; setTimeout(() => { wrap.remove(); resolve(); }, 520); }, 1400);
          }
        } else {
          pImg.style.position = ''; pImg.style.left = ''; pImg.style.top = ''; pImg.style.width = '58px'; pImg.style.zIndex = '';
          tray.appendChild(pImg);
        }
      };
      pImg.addEventListener('mousedown', onDown);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
      pImg.addEventListener('touchstart', onDown, { passive: false });
      window.addEventListener('touchmove', onMove, { passive: false });
      window.addEventListener('touchend', onUp);
    });
  });
}
async function startWellMinigame() {
  if (mode !== 'field') return;
  held.length = 0;
  draw(true); fctx.drawImage(canvas, 0, 0);
  frozen.classList.add('now');
  setView('photo'); photoEl.src = A.photos.wellBoy; photoBgEl.src = A.photos.wellBoy; SFX.photo();
  bodyEl.textContent = ''; nameEl.textContent = ''; nextDlg.classList.remove('on'); vn.ready = false;
  screens.forEach(s => s.classList.toggle('active', s.id === 'vn'));
  mode = 'vn'; updateTouch();
  requestAnimationFrame(() => requestAnimationFrame(() => frozen.classList.remove('now')));
  await new Promise(resolve => {
    vnPrepare([{ type: 'say', who: '안내', photo: 'wellBoy', segs: plain('스페이스바를 정확한 타이밍에 누르면 우물에서 물을 길을 수 있습니다.') }, { type: 'villagerDone', resolve }]);
    runStep();
  });
  setMission('정확한 타이밍에 스페이스바를 눌러 우물에서 물을 깃자', true);
  await runWellMinigame();
  amiBucketReady = true;
  await new Promise(resolve => { vnPrepare([...AMI_WELLDONE_SCRIPT, { type: 'villagerDone', resolve }]); runStep(); });
  screens.forEach(s => s.classList.toggle('active', s.id === 'field'));
  mode = 'field';
  completeObjective();
  updateTouch();
  lastTs = performance.now();
  if (!raf) raf = requestAnimationFrame(loop);
}
async function villagerTalk(lines) {          // 미션과 상관없이, 주민을 클릭하면 짧은 대화가 뜨고 제자리로 돌아옴

    vnPrepare([...lines, { type: 'villagerDone', resolve }]);

  });
  screens.forEach(s => s.classList.toggle('active', s.id === 'field'));

}
function beginTalk() {
  hover.npc = hover.tv = false;
  if (M === MAPS.hospital) hospState = { x: p.x, dir: p.dir, cam };   // 다음 조작 구간에서 이 자리부터 이어서

/* ─────────── 터치 버튼 (모바일) ─────────── */
const touchEl = $('#touch');
let touchOn = matchMedia('(pointer: coarse)').matches;   // 데스크톱에서는 T 키로 미리보기
function updateTouch() {
  const on = touchOn && mode === 'field';
  touchEl.classList.toggle('on', on);

  if (!on) { touchEl.querySelectorAll('.down').forEach(b => b.classList.remove('down')); return; }
  // 캐릭터가 서는 바닥선(GROUND) 아래쪽 공간에 맞춰 버튼 크기 결정 → 캐릭터를 가리지 않음
  const r = stage.getBoundingClientRect(), k = r.height / VH;
  const safeB = parseFloat(getComputedStyle(document.documentElement).paddingBottom) || 0;
  const avail = window.innerHeight - safeB - 10 - (r.top + (GROUND + 14) * k);
  touchEl.style.setProperty('--sz', clamp(Math.floor(avail), 46, 76) + 'px');
}
const TDIR = { left: -1, right: 1 };
touchEl.querySelectorAll('.tbn').forEach(b => {
  const k = b.dataset.k;
  const down = e => {
    e.preventDefault();
    if (b.setPointerCapture) { try { b.setPointerCapture(e.pointerId); } catch (_) {} }
    b.classList.add('down'); SFX.tap();
    if (TDIR[k] !== undefined) { const i = held.indexOf(TDIR[k]); if (i >= 0) held.splice(i, 1); held.push(TDIR[k]); }
    else if (k === 'jump') jumpReq = performance.now();
    else if (k === 'pick') pickReq = performance.now();
  };
  const up = () => {
    b.classList.remove('down');
    if (TDIR[k] !== undefined) { const i = held.indexOf(TDIR[k]); if (i >= 0) held.splice(i, 1); }
  };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
});
touchEl.addEventListener('contextmenu', e => e.preventDefault());

/* ─────────── 키 입력 (e.code 사용: 한글 입력 상태에서도 동작) ─────────── */
addEventListener('keydown', e => {
  if (mode === 'credits' && e.code === 'Escape' && !busy) { busy = true; go('title').then(() => { busy = false; }); return; }
  if (mode === 'vn') {
    if (vn.view === 'quiz') { const n = parseInt(e.key, 10); if (n >= 1 && n <= 4 && vn.quizPick) vn.quizPick(n - 1); return; }
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) advance(); }
    return;
  }
  if (mode !== 'field') return;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  const now = performance.now();
  if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
    const d = e.code === 'ArrowLeft' ? -1 : 1;
    const i = held.indexOf(d); if (i >= 0) held.splice(i, 1); held.push(d);
  } else if (e.code === 'Space') { if (!e.repeat) jumpReq = now; }
  else if (e.code === 'KeyZ') { if (!e.repeat) pickReq = now; }
  else if (e.code === 'KeyD') { if (!e.repeat) debug = !debug; }
  else if (e.code === 'KeyT') { if (!e.repeat) { touchOn = !touchOn; updateTouch(); } }
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') { const d = e.code === 'ArrowLeft' ? -1 : 1; const i = held.indexOf(d); if (i >= 0) held.splice(i, 1); }
});
addEventListener('blur', () => { held.length = 0; });

window.__game = game;
})();
